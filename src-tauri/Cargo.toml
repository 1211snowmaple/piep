[package]
name = "piep"
version = "0.2.0"
description = "Local creative library for Pixiv and FANBOX"
authors = ["1211snowmaple"]
edition = "2021"

[lib]
name = "piep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.3", features = ["form", "json", "query"] }
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-store = "2.4.3"
sha2 = "0.11.0"
base64 = "0.22.1"
url = "2.5.8"
rand = "0.10.1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
kv-pairs = "0.1"
thiserror = "2.0"
arc-swap = "1.8"
async-stream = "0.3"
futures-core = "0.3"
log = "0.4"
tauri-plugin-dialog = "2.7.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.34.0", features = ["bundled"] }
zip = "8.6.0"
minijinja = "2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
zenjpeg = "0.8.3"
magetypes = "=0.9.16"
oxipng = { version = "10.1.1", default-features = false }
webp = "0.3"
tantivy = "0.26.1"
unicode-normalization = "0.1"
wana_kana = "5"
lindera = { version = "3", features = ["embed-ipadic"] }
fastembed = { version = "5", features = ["directml"] }
ort = { version = "2.0.0-rc.12", features = ["directml"] }
rayon = "1.10"
hnsw_rs = "0.3.4"
parking_lot = "0.12.5"

[profile.release]
opt-level = 3     # Optimize preview builds for UX speed over binary size
lto = "thin"      # Keep cross-crate wins without the long full-LTO wall time
codegen-units = 8 # Parallelize release compilation while preserving good runtime codegen
panic = "abort"   # Reduce binary size by avoiding stack unwinding
strip = true      # Strip all debug symbols to further reduce file size
