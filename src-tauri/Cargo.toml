[package]
name = "piep"
version = "0.14.0"
description = "Local creative library for Pixiv and FANBOX"
authors = ["1211snowmaple"]
edition = "2021"

[lib]
name = "piep_lib"
# piep is a Windows desktop application. The Tauri template also enables
# staticlib/cdylib for Android and iOS entry points, but those extra artifacts
# are neither loaded nor distributed here. On MSVC the unused cdylib makes
# link.exe create an import library and print a normal status line to stdout;
# rustc then reports that line as a `linker_messages` warning. Build only the
# Rust library the desktop executable actually links.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13.3", features = ["form", "json", "query", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-store = "2.4.3"
sha2 = "0.11.0"
base64 = "0.22.1"
url = "2.5.8"
rand = "0.10.1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
kv-pairs = "0.1"
thiserror = "2.0"
arc-swap = "1.8"
async-stream = "0.3"
futures-core = "0.3"
# 推論サーバーの置き場所をまとめて叩くのに使う。全部止まっていても、
# 待ち時間は1回ぶんで済む。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = { version = "0.4", features = ["std"] }
tauri-plugin-dialog = "2.7.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
zip = "8.6.0"
minijinja = "2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
zenjpeg = "0.8.3"
magetypes = "=0.9.16"
oxipng = { version = "10.1.1", default-features = false }
webp = "0.3"
tantivy = "0.26.1"
unicode-normalization = "0.1"
wana_kana = "5"
lindera = { version = "3", features = ["embed-ipadic"] }
fastembed = { version = "5", features = ["directml"] }
ort = { version = "2.0.0-rc.12", features = ["directml"] }
rayon = "1.10"
parking_lot = "0.12.5"
tauri-plugin-notification = "2.3.3"
# アプリ本体の更新。updater は配布物への署名が前提なので、公開鍵は
# tauri.conf.json、秘密鍵はリリース時の環境変数に置く。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3     # Optimize preview builds for UX speed over binary size
lto = "thin"      # Keep cross-crate wins without the long full-LTO wall time
codegen-units = 8 # Parallelize release compilation while preserving good runtime codegen
panic = "abort"   # Reduce binary size by avoiding stack unwinding
strip = true      # Strip all debug symbols to further reduce file size
