name: "Quality"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      # 依存木に ort・DirectML・tantivy・lindera・画像コーデックが入るので、
      # 素で組むと1ジョブ20分かかる。`docs.yml` は既にこれを使っている。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR ごとに保存すると上限 10GB を超え、main とリリースの分が押し出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      # Rust は `-D warnings` で通しているのに、28k 行の React 側は型検査だけ
      # だった。hooks の依存漏れと Promise の取りこぼしは型では捕まらない。
      - run: npm run lint
      # 試験はテストごとに別のプロセスで走らせる。Tantivy は1つの索引に
      # IndexWriter を1つしか許さず、アプリも起動時に棚を排他で握る。同じ
      # プロセスで索引つきの試験を並べると、Windows では書き込みが
      # "Access is denied" で落ちるため、以前は `--test-threads=1` で1本ずつ
      # 流していた（単体と library_core で約10分）。nextest は試験ごとに
      # プロセスを分けるので、実際の使われ方（1プロセスに1つの棚）を保った
      # まま並べられる。一時フォルダーは試験ごとに一意の名前を付けている。
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci
      # nextest は doctest を走らせない。
      - run: cargo test --manifest-path src-tauri/Cargo.toml --doc
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # 適合の根拠は EPUBCheck に置いている（docs/policy/02-principles.md）。
      # 内蔵の検証器は自分で書いた規則しか知らないので、外の権威の代わりには
      # ならない。手で一度走らせた結果は EPUB のコードが変わった時点で根拠で
      # なくなるため、変更のたびに取り直す。原稿は利用者のライブラリを要さない。
      # 例は nextest の手順で test の設定のまま組み上がっている。`cargo run` は
      # dev の設定で本体を組み直し、2分ほど余計にかかっていたので、できた物を
      # そのまま動かす。
      - run: ./src-tauri/target/debug/examples/epub_conformance.exe ${{ runner.temp }}/epub-conformance
      - name: EPUBCheck
        shell: pwsh
        run: |
          $version = '5.3.0'
          # 手元で「致命的0・エラー0・警告0」を確認した配布物そのものを指す。
          # 版と指紋の両方を固定しないと、通ったのがどれだったのか後から言えない。
          $expected = '6C07E68584B2E2CE2F89FE06E1246DFEAD3EB36B46B340E7D93524F29DCFF6C5'
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            throw 'java が見つかりません。ランナーの構成が変わった可能性があります'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'epubcheck.zip'
          Invoke-WebRequest -Uri "https://github.com/w3c/epubcheck/releases/download/v$version/epubcheck-$version.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($actual -ne $expected) { throw "EPUBCheck の指紋が違います: $actual" }
          $root = Join-Path $env:RUNNER_TEMP 'epubcheck'
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $jar = Join-Path $root "epubcheck-$version/epubcheck.jar"
          $books = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'epub-conformance') -Filter *.epub
          if ($books.Count -eq 0) { throw '検証する EPUB がありません' }
          $failed = @()
          foreach ($book in $books) {
            Write-Host "--- $($book.Name)"
            # 警告も落とす。いまは0件なので、増えた時点で気づけるようにする。
            # 文言はランナーの地域設定に左右させない。読めない記録は根拠にならない。
            & java -jar $jar --locale en --failonwarnings $book.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $book.Name }
          }
          if ($failed.Count -gt 0) { throw "EPUBCheck が問題を報告しました: $($failed -join ', ')" }

  visual-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      # Rust を組まない側で流し、checks の待ち時間から外す。
      - run: npm test
      - run: npx playwright install chromium
      # Built here rather than inside the Playwright web server so a build
      # failure reads as a build failure.
      - run: npm run build
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-report
          path: |
            playwright-report
            test-results/playwright

  native-window-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      # 依存木に ort・DirectML・tantivy・lindera・画像コーデックが入るので、
      # 素で組むと1ジョブ20分かかる。`docs.yml` は既にこれを使っている。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR ごとに保存すると上限 10GB を超え、main とリリースの分が押し出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: src-tauri
      - run: npm ci
      # npm 12 treats dashed arguments after `npm run ... --` as npm config
      # flags on Windows. Invoke the already-installed local binary directly.
      - run: npx --no-install tauri build --debug --no-bundle
      - shell: powershell
        run: ./e2e/native-window-smoke.ps1 -Executable ./src-tauri/target/debug/piep.exe
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-window-smoke
          path: test-results/native
