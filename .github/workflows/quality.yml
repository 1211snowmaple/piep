name: "Quality"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# 同じ PR に新しく push したら古い実行を取り消す。実行役は2台しかないので、古いコミットの
# 検査が新しい方を待たせる。main の実行はリリースの関門にも使うので取り消さない。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 検査の中身は tools/check.ps1 にある。ここは環境を用意して段を呼ぶだけにする。
#
# 重いジョブは利用者の PC（self-hosted、ラベル snow）で動かす。組み立ての途中経過が
# 残るので、キャッシュの復元なしで数分で終わる。次のときだけ GitHub のランナーへ回す。
#   - リポジトリの変数 CI_RUNNER が self でない（PC を長く止めるときに hosted にする）
#   - よそのフォークからの PR（公開リポジトリなので、他人のコードを PC で動かさない）
# 窓を開く native-window-smoke は、使っている画面に割り込むので GitHub のランナーで動かす。
jobs:
  checks:
    runs-on: ${{ (vars.CI_RUNNER == 'self' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","snow"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          # self-hosted では利用者の npm のキャッシュがそのまま使える。書き戻さない。
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      # 版は rust-toolchain.toml が決める。既定の版は変えない（self-hosted では利用者の rustup）。
      - run: rustup toolchain install
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR ごとに保存すると上限 10GB を超え、main の分が押し出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: src-tauri
      - if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
      - run: npm ci
      - run: ./tools/check.ps1 -Stage frontend,rust

  visual-regression:
    runs-on: ${{ (vars.CI_RUNNER == 'self' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","snow"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      - run: npx playwright install chromium
      - run: ./tools/check.ps1 -Stage visual
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-report
          path: |
            playwright-report
            test-results/playwright

  native-window-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: src-tauri
      - run: npm ci
      # npm 12 treats dashed arguments after `npm run ... --` as npm config
      # flags on Windows. Invoke the already-installed local binary directly.
      - run: npx --no-install tauri build --debug --no-bundle
      - shell: powershell
        run: ./e2e/native-window-smoke.ps1 -Executable ./src-tauri/target/debug/piep.exe
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-window-smoke
          path: test-results/native
