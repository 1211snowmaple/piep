name: "Quality"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run check
      - run: npm test
      # One thread: Tantivy allows a single IndexWriter per directory, and the
      # app only ever opens one library per process - it takes an exclusive
      # lock on it at startup. Running the index-backed tests side by side puts
      # dozens of writers in one process, which on Windows fails commits with
      # "Access is denied". Serial runs match how the component is really used
      # and cost about twenty seconds against a twenty-minute compile.
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  visual-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Built here rather than inside the Playwright web server so a build
      # failure reads as a build failure.
      - run: npm run build
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            playwright-report
            test-results/playwright

  native-window-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri -- build --debug --no-bundle
      - shell: powershell
        run: ./e2e/native-window-smoke.ps1 -Executable ./src-tauri/target/debug/piep.exe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-window-smoke
          path: test-results/native
