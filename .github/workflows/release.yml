name: "Release"

on:
  push:
    tags:
      - "v*"

# piep is a Windows application: semantic search runs on DirectML, the embedded
# browser and the authentication window are WebView2, and every test that drives
# a real window runs on Windows. Building installers for platforms nothing is
# verified on would ship binaries no one has ever started.
#
# ここでは試験を走らせない。同じコミットの main 上の Quality 成功を
# 下のゲートで確認し、同じ試験を二重に走らせない。
#
# tauri-action は下書きの配布として作る。公開は別の操作で行う。
jobs:
  release:
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 道具を入れる前に照合する。食い違っていれば数秒で落ちる。
      - name: Verify release tag and version files
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must be vX.Y.Z'
          }
          $expected = '${{ github.ref_name }}'.Substring(1)
          $package = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $packageLock = (Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $tauri = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cargo = [regex]::Match((Get-Content -LiteralPath src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $frontend = [regex]::Match((Get-Content -LiteralPath src/lib/version.ts -Raw), '"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $versions = @($package, $packageLock, $tauri, $cargo, $frontend)
          if ($versions | Where-Object { $_ -ne $expected }) {
            throw "Tag $expected does not match version files: $($versions -join ', ')"
          }

      - name: Require Quality success on main for the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $relationship = (gh api "repos/$env:GITHUB_REPOSITORY/compare/$commit...main" --jq '.status').Trim()
          if ($relationship -notin @('ahead', 'identical')) {
            throw "Tagged commit $commit is not on main (compare status: $relationship)"
          }
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $runs = @(gh run list --workflow quality.yml --commit $commit --branch main --limit 100 --json conclusion,createdAt,event,headSha,status | ConvertFrom-Json)
            $latest = $runs | Where-Object { $_.headSha -eq $commit -and $_.event -eq 'push' } | Sort-Object createdAt -Descending | Select-Object -First 1
            if ($latest.status -eq 'completed') {
              if ($latest.conclusion -ne 'success') { throw "Quality for $commit ended with $($latest.conclusion)" }
              break
            }
            if ($attempt -eq 59) { throw "Quality has not succeeded for $commit" }
            Start-Sleep -Seconds 30
          }

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      # clippy と rustfmt はここでは使わない。走らせるのは quality.yml。
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      # 依存木に ort・DirectML・tantivy・lindera・画像コーデックが入るので、
      # 素で組むと17分かかる。quality.yml と鍵を分けてあるのは、あちらが
      # debug でしか組まないから。cargo は profile ごとに成果物を分けるので、
      # debug の cache を引いてもここでは一つも再利用できない。数 GB を
      # 落として捨てるだけになる。ここが引くのは前回のリリースが残した
      # release の成果物で、依存が動いた回は restore-keys で近いものに落ちる。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アプリ内更新は署名された配布物しか受け付けない。鍵が無いビルドは
          # latest.json を作れないので、更新の告知だけが止まる。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 鍵にパスワードを付けていないので、この秘密は未登録でよい。未登録の
          # 秘密は空文字として展開され、それがそのまま「パスワード無し」を意味する。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "piep v__VERSION__"
          releaseBody: "Windows 向けインストーラーは下のアセットからダウンロードできます。"
          releaseDraft: true
          prerelease: false
          # アプリが読みに来る更新目録。これがリリースの資材に無いと、
          # インストール済みの piep からは新しい版が見えない。
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify branded Windows updater asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download '${{ github.ref_name }}' --pattern latest.json --dir $env:RUNNER_TEMP
          $manifest = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'latest.json') -Raw | ConvertFrom-Json -AsHashtable
          $platforms = $manifest['platforms']
          if (-not $platforms -or -not $platforms.ContainsKey('windows-x86_64')) {
            throw 'Updater manifest has no generic Windows target for existing installs'
          }
          foreach ($target in @('windows-x86_64', 'windows-x86_64-nsis')) {
            if ($platforms.ContainsKey($target)) {
              if ($platforms[$target]['url'] -notmatch '_x64-setup\.exe$') {
                throw "$target does not point to the branded NSIS installer"
              }
              if (-not $platforms[$target]['signature']) {
                throw "$target has no updater signature"
              }
            }
          }
          if ($platforms.ContainsKey('windows-x86_64-msi')) {
            throw 'Updater manifest still exposes the unbranded MSI path'
          }
