name: "Release"

on:
  push:
    tags:
      - "v*"

# piep is a Windows application: semantic search runs on DirectML, the embedded
# browser and the authentication window are WebView2, and every test that drives
# a real window runs on Windows. Building installers for platforms nothing is
# verified on would ship binaries no one has ever started.
jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Install documentation tool dependencies
        run: npm --prefix docs-tools ci

      - name: Verify release tag and version files
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must be vX.Y.Z'
          }
          $expected = '${{ github.ref_name }}'.Substring(1)
          $package = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $packageLock = (Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $tauri = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cargo = [regex]::Match((Get-Content -LiteralPath src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $frontend = [regex]::Match((Get-Content -LiteralPath src/lib/version.ts -Raw), '"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $versions = @($package, $packageLock, $tauri, $cargo, $frontend)
          if ($versions | Where-Object { $_ -ne $expected }) {
            throw "Tag $expected does not match version files: $($versions -join ', ')"
          }

      - name: Frontend type and unit tests
        run: |
          npm run check
          npm test

      - name: Rust tests and lints
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Frontend and Rust IPC contract
        run: npm --prefix docs-tools run docs:check

      - name: Install visual test browser
        run: npx playwright install chromium

      - name: Visual regression
        run: |
          npm run build
          npm run test:visual

      - name: Native window smoke test
        shell: pwsh
        run: |
          npx --no-install tauri build --debug --no-bundle
          ./e2e/native-window-smoke.ps1 -Executable ./src-tauri/target/debug/piep.exe

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アプリ内更新は署名された配布物しか受け付けない。鍵が無いビルドは
          # latest.json を作れないので、更新の告知だけが止まる。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 鍵にパスワードを付けていないので、この秘密は未登録でよい。未登録の
          # 秘密は空文字として展開され、それがそのまま「パスワード無し」を意味する。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "piep v__VERSION__"
          releaseBody: "Windows 向けインストーラーは下のアセットからダウンロードできます。"
          releaseDraft: true
          prerelease: false
          # アプリが読みに来る更新目録。これがリリースの資材に無いと、
          # インストール済みの piep からは新しい版が見えない。
          includeUpdaterJson: true
