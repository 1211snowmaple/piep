name: "Release"

on:
  push:
    tags:
      - "v*"

# piep is a Windows application: semantic search runs on DirectML, the embedded
# browser and the authentication window are WebView2, and every test that drives
# a real window runs on Windows. Building installers for platforms nothing is
# verified on would ship binaries no one has ever started.
#
# ここでは試験を走らせない。同じコミットの main 上の Quality 成功を
# 下のゲートでQualityとDocsのcontract成功を確認し、同じ試験を二重に走らせない。
#
# 配布は下書きとして作る。公開は別の操作で行う。
jobs:
  release:
    permissions:
      contents: write
      actions: read
    # 組み立ては利用者の PC（self-hosted、ラベル snow）で、release の途中経過を使い回す。
    # CI_RUNNER が self でなければ GitHub のランナーで素から組む。
    runs-on: ${{ vars.CI_RUNNER == 'self' && fromJSON('["self-hosted","snow"]') || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 道具を入れる前に照合する。食い違っていれば数秒で落ちる。
      - name: Verify release tag and version files
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must be vX.Y.Z'
          }
          $expected = '${{ github.ref_name }}'.Substring(1)
          $package = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $packageLock = (Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $tauri = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cargo = [regex]::Match((Get-Content -LiteralPath src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $frontend = [regex]::Match((Get-Content -LiteralPath src/lib/version.ts -Raw), '"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $versions = @($package, $packageLock, $tauri, $cargo, $frontend)
          if ($versions | Where-Object { $_ -ne $expected }) {
            throw "Tag $expected does not match version files: $($versions -join ', ')"
          }

      - name: Require the tagged commit to be on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $relationship = (gh api "repos/$env:GITHUB_REPOSITORY/compare/$commit...main" --jq '.status').Trim()
          if ($relationship -notin @('ahead', 'identical')) {
            throw "Tagged commit $commit is not on main (compare status: $relationship)"
          }

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      # 版は rust-toolchain.toml が決める。既定の版は変えない（self-hosted では利用者の rustup）。
      - name: Install Rust
        run: rustup toolchain install

      - name: Install frontend dependencies
        run: npm ci

      # 組み立ては品質の確認を待たずに始める。以前は Quality の終わり（約30分）を
      # 待ってから組み始めていたので、全体が足し算になっていた。ここで組むのは
      # 手元の成果物だけで、配布（下書きの作成と載せる物）はすべて確認の後にある。
      - name: Build the installer ahead of the quality gate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --no-install tauri build

      # 単独サーバーは Tauri の成果物ではないので別に組む。デスクトップ版の
      # 自動更新と同じ鍵で署名し、組み込みの公開鍵で検証できることまで確かめる。
      # 管理画面を埋め込むのはこちらだけ。インストーラーは上で組み終えている。
      - name: Build, sign and check the standalone server ahead of the quality gate
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $tag = '${{ github.ref_name }}'
          npm run build:admin
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the admin screen' }
          # 管理画面が空のまま配らない。
          $env:PIEP_REQUIRE_ADMIN_UI = '1'
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --example piep-server
          if ($LASTEXITCODE -ne 0) { throw 'Could not build piep-server' }
          $output = Join-Path $env:RUNNER_TEMP 'server'
          $zip = ./tools/package-server.ps1 -Version $version -OutputDir $output | Select-Object -Last 1
          npx tauri signer sign $zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not sign the server package' }
          $signature = "$zip.sig"
          & src-tauri/target/release/examples/piep-server.exe verify-package $zip $signature
          if ($LASTEXITCODE -ne 0) { throw 'The server package does not verify with the embedded key' }
          $name = Split-Path $zip -Leaf
          $manifest = Join-Path $output 'latest-server.json'
          @{
            version = $version
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
            signature = (Get-Content -LiteralPath $signature -Raw).Trim()
          } | ConvertTo-Json | Set-Content -LiteralPath $manifest -Encoding utf8NoBOM

      - name: Require Quality and contract success on main for the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $runs = @(gh run list --workflow quality.yml --commit $commit --branch main --limit 100 --json conclusion,createdAt,event,headSha,status | ConvertFrom-Json)
            $latest = $runs | Where-Object { $_.headSha -eq $commit -and $_.event -eq 'push' } | Sort-Object createdAt -Descending | Select-Object -First 1
            if ($latest.status -eq 'completed') {
              if ($latest.conclusion -ne 'success') { throw "Quality for $commit ended with $($latest.conclusion)" }
              break
            }
            if ($attempt -eq 119) { throw "Quality has not succeeded for $commit" }
            Start-Sleep -Seconds 30
          }
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $runs = @(gh run list --workflow docs.yml --commit $commit --branch main --limit 100 --json databaseId,createdAt,event,headSha | ConvertFrom-Json)
            $latest = $runs | Where-Object { $_.headSha -eq $commit -and $_.event -eq 'push' } | Sort-Object createdAt -Descending | Select-Object -First 1
            if ($latest) {
              $details = gh run view $latest.databaseId --json jobs | ConvertFrom-Json
              $contract = $details.jobs | Where-Object { $_.name -eq 'contract' } | Select-Object -First 1
              if ($contract.status -eq 'completed') {
                if ($contract.conclusion -ne 'success') { throw "Contract for $commit ended with $($contract.conclusion)" }
                break
              }
            }
            if ($attempt -eq 119) { throw "Contract has not succeeded for $commit" }
            Start-Sleep -Seconds 30
          }

      # 下書きを作って載せるのは、ここから先だけ。
      #
      # 以前は tauri-action が組み立てと下書きの作成を一度にしていた。組み立てを
      # 確認の前へ出すと、あの action は同じ組み立てをもう一度呼ぶ。本体の
      # build.rs は管理画面（admin-dist）を埋め込むので、単独サーバーのために
      # 管理画面を組んだあとでは本体が組み直しになり、デスクトップ版にも管理画面が
      # 入ってしまう。載せる物と更新の告知（latest-v2.json）は、あの action が
      # 作っていたのと同じ形でここで作る。
      #
      # 告知は、識別子を変える前のアプリとは分けた名前（latest-v2.json）で出す。
      # 既存のインストールが読む windows-x86_64 と、NSIS を指す
      # windows-x86_64-nsis の二つを、署名済みの setup.exe に向ける。
      - name: Create the draft release and attach every asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring(1)
          $notes = 'Windows 向けインストーラーは下のアセットからダウンロードできます。'
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $setupName = "piep_${version}_x64-setup.exe"
          $setup = Join-Path $bundle $setupName
          $setupSignature = "$setup.sig"
          foreach ($path in @($setup, $setupSignature)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing installer output: $path" }
          }
          $signature = (Get-Content -LiteralPath $setupSignature -Raw).Trim()
          if (-not $signature) { throw 'The installer has no updater signature' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$setupName"
          $entry = [ordered]@{ signature = $signature; url = $url }
          $updater = Join-Path $env:RUNNER_TEMP 'latest-v2.json'
          [ordered]@{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            platforms = [ordered]@{
              'windows-x86_64' = $entry
              'windows-x86_64-nsis' = $entry
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $updater -Encoding utf8NoBOM

          $server = Join-Path $env:RUNNER_TEMP 'server'
          $zip = Join-Path $server "piep-server-$version-windows-x64.zip"
          $assets = @($setup, $setupSignature, $updater, $zip, "$zip.sig", (Join-Path $server 'latest-server.json'))
          foreach ($path in $assets) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release asset: $path" }
          }

          # 再実行では、前の回が作った下書きへ載せ直す。
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --verify-tag --title "piep v$version" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release assets' }

          $release = gh release view $tag --json tagName,isDraft,assets | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw "Release is attached to $($release.tagName), not $tag" }
          if (-not $release.isDraft) { throw 'Release is not a draft' }
          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @($assets | ForEach-Object { Split-Path $_ -Leaf } | Sort-Object)
          if (Compare-Object $names $expected) {
            throw "Release assets differ from the expected set: $($names -join ', ')"
          }
