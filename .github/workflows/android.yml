name: "Android"

# 携帯アプリの画面側を確かめ、鍵なしで APK まで組めることを確かめる。
# 署名した配布物は Release ワークフローが同じ手順（android-apk.yml）で組む。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-apk.yml"
      - "crates/**"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-apk.yml"
      - "crates/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm ci
      # 型検査と本番用の組み立て。
      - run: npm run build
      - run: npm test

  apk:
    uses: ./.github/workflows/android-apk.yml
    with:
      sign: false
