<!--
  The lockup shown at the top left of the app, drawn as a single file so the
  README can carry it. The interface composes the mark and the wordmark in
  HTML (src/components/PiepLockup.tsx); here the wordmark is converted to
  outlines - Trebuchet MS Bold, the face the font stack resolves to - so the
  two halves keep their colours and proportions wherever the README is read.

  Proportions come from .piep-lockup in src/styles/app.css: with the wordmark
  at 100 units, the mark is 1.99x that wide and the gap between them 0.27x.
-->
